<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCraft | Infinite World</title>
  <link rel="stylesheet" href="./src/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <aside class="panel">
    <div class="brand">⛏️ MCraft</div>
    <p class="subtitle">Infinite Chunk World Generator</p>

    <label for="seed">World Seed</label>
    <div class="row">
      <input id="seed" value="739182" autocomplete="off" />
      <button id="randomSeed" title="Random seed">🎲</button>
    </div>

    <button id="generate" class="primary">🌍 Generate / Reset World</button>
    <button id="cavePreview" style="margin-top:10px">🕳️ Show Underground</button>

    <div class="stats">
      <div><span>World Seed</span><b id="seedStatus">739182</b></div>
      <div><span>Player X/Z</span><b id="coord">0, 0</b></div>
      <div><span>Chunk X/Z</span><b id="chunkCoord">0, 0</b></div>
      <div><span>Loaded Chunks</span><b id="chunks">0</b></div>
    </div>

    <p class="hint">WASD = move • Q/E = up/down • Drag = look • Scroll = zoom</p>
  </aside>

  <main id="viewport"></main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
